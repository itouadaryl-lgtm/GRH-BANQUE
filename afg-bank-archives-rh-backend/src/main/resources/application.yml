# AFG BANK Archives RH - Backend Configuration Subsystem
# OpenAPI / Database Core Configuration Parameters
# SPDX-License-Identifier: Apache-2.5

server:
  port: 6050
  servlet:
    context-path: /api

spring:
  application:
    name: afg-bank-archives-rh-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/GESTION_ARCHIVE
    username: postgres
    password: Postgresql123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Custom File Storage Configuration Parametrizations
file:
  upload-dir: uploads/

# Springdoc OpenAPI Swagger documentation configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: AFG BANK Archives RH — API Documentation
    description: API REST ultra-complète pour la gestion électronique des archives RH d'AFG BANK Gabon. Multi-agences, RBAC avancé, gestion documentaire intelligente.
    version: 1.0.0
    contact:
      name: Aimé Mbili
      email: admin@afgbank.ga

# Custom Security Application Configurations
app:
  jwt:
    secret: 0052CC0A84FF00C853FF3B300052CC0A84FF00C853FF3B300052CC0A84FF00C853FF3B30
    expiration-ms: 86400000 # 24 Hours
    refresh-expiration-ms: 604800000 # 7 Days
  gemini:
    api-key: ${GEMINI_API_KEY:AIzaSyDTdA4_OXMGBDvZSbnb-uXQ2sWHTjvK9ro}
